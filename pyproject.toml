[project]
name = "computeruse"
version = "0.1.0"
description = "Automated computer-use system: sandboxed VM control, agent harness, and observability web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "python-xlib>=0.33",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "google-auth[requests]>=2.30",
]

[project.scripts]
computeruse = "computeruse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computeruse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # UP042: (str, Enum) kept for pydantic/JSON interop
